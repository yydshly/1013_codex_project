<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc">
<title id="title">能力分组与研究工作流</title><desc id="desc">15 个项目的整体关系：获取资料、分析验证、知识检索与内容输出为主线，任务、模型和网络为可选支撑，shadPS4 与 Leak Check 为专项或参考支线。这是基于固定研究版本整理的组合方案，职责互补不表示已有现成连接；接口、资料格式、运行环境与验收仍需适配。</desc>
