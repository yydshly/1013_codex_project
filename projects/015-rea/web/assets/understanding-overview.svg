<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc"><title id="title">REA：软件分析能力接入 AI，沿着证据调查</title><desc id="desc">输入问题与材料，AI 选择调查，REA 接入并组织证据，分析工具读取与观察。输出事实、位置、关系和未知，支持解释、局部复现与验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#1d716b" stroke-width="1.6"/></marker></defs><rect width="1600" height="930" fill="#f5f4ef"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif" fill="#172b37"><text x="65" y="64" font-size="17" letter-spacing="3" fill="#1d716b">015 / REVERSE ENGINEER ANYTHING</text><text x="65" y="128" font-size="45" font-weight="700">把软件分析能力接到 AI，沿着证据调查。</text><text x="65" y="165" font-size="21" fill="#576973">反汇编是其中一部分；应用结构、资源、网络与运行行为也有分析入口。</text><rect x="65" y="205" width="1470" height="68" rx="12" fill="#d7f0e6"/><text x="90" y="247" font-size="23" font-weight="600">输入</text><text x="175" y="247" font-size="22">具体问题 + 对应版本的软件材料 + 目标、动作与分析条件</text><rect x="65" y="310" width="460" height="290" rx="17" fill="#fff" stroke="#dce2df"/><text x="93" y="352" font-size="15" fill="#1d716b">A / AI 助手</text><text x="93" y="400" font-size="30" font-weight="650" fill="#172b37">选择动作，理解结果</text><text x="93" y="447" font-size="21" fill="#576973">将问题变成查询，解释证据。</text><text x="93" y="485" font-size="21" fill="#576973">继续追问，编写自己的实现。</text><text x="93" y="556" font-size="18" fill="#1d716b">人和实验核查结论与行为</text><rect x="570" y="310" width="460" height="290" rx="17" fill="#142e3b" stroke="#dce2df"/><text x="598" y="352" font-size="15" fill="#a9d5c6">R / REA</text><text x="598" y="400" font-size="30" font-weight="650" fill="#edf4f1">接入工具，组织证据</text><text x="598" y="447" font-size="21" fill="#bfced2">CLI / MCP 与共享调查流程。</text><text x="598" y="485" font-size="21" fill="#bfced2">解析、追踪、比较和未知记录。</text><text x="598" y="556" font-size="18" fill="#b7e0d0">结果附身份、位置、关系与限制</text><rect x="1075" y="310" width="460" height="290" rx="17" fill="#fff" stroke="#dce2df"/><text x="1103" y="352" font-size="15" fill="#1d716b">T / 分析工具</text><text x="1103" y="400" font-size="30" font-weight="650" fill="#172b37">读取材料，观察行为</text><text x="1103" y="447" font-size="21" fill="#576973">Ghidra / JavaScript 解析等。</text><text x="1103" y="485" font-size="21" fill="#576973">浏览器、进程与历史记录。</text><text x="1103" y="556" font-size="18" fill="#1d716b">能力取决于引擎、材料与平台</text><path d="M531 420H560 M1036 420H1065 M1065 507H1036 M560 507H531" stroke="#1d716b" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="637" width="1470" height="88" rx="12" fill="#e8eee8"/><text x="90" y="672" font-size="22" font-weight="600">输出</text><text x="175" y="672" font-size="21">代码或观察材料 + 来源位置 + 关系 + 证据身份 + 未知与限制</text><text x="175" y="704" font-size="18" fill="#576973">AI 据此解释与局部复现，最后用原程序、源码或实验进行对照验证。</text><rect x="65" y="766" width="460" height="100" rx="12" fill="#fff" stroke="#dce2df"/><text x="89" y="801" font-size="21" font-weight="600">静态关系</text><text x="89" y="837" font-size="18" fill="#576973">可达路径不能直接证明实际执行。</text><rect x="570" y="766" width="460" height="100" rx="12" fill="#fff" stroke="#dce2df"/><text x="594" y="801" font-size="21" font-weight="600">运行观察</text><text x="594" y="837" font-size="18" fill="#576973">一次记录只支持对应条件与窗口。</text><rect x="1075" y="766" width="460" height="100" rx="12" fill="#fff" stroke="#dce2df"/><text x="1099" y="801" font-size="21" font-weight="600">因果与等价</text><text x="1099" y="837" font-size="18" fill="#576973">需要额外对照，有限验证有范围。</text><text x="65" y="909" font-size="15" fill="#576973">本仓库原创理解图 · 固定版本 ebaaa79c · 2026-10-14 · 非上游运行截图，未调用 REA 或模型</text></g></svg>