<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">OpenMontage：阶段、成果、工具与检查如何组合</title>
<desc id="desc">原创理解图。AI 助手读取流程与技能，依次完成研究、脚本、分镜、素材、剪辑和合成。生成素材、真实镜头检索、代码画面三条路径为制作提供资源；检查点、确认、预算和质量检查贯穿过程。</desc>
