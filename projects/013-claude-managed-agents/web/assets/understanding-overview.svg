<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2600" viewBox="0 0 1200 2600" role="img" aria-labelledby="title desc">
  <title id="title">Claude Managed Agents 完整能力、任务拆分与黑盒边界总览</title>
  <desc id="desc">单次工作流累计启动 Agent 上限 1000，不是并发数量。主 Agent 使用模型规划任务，程序下发与交接，平台支撑运行。任务契约包含能力、输入、输出、依赖约束、验收和失败处理。内部实现可按黑盒使用，状态和证据需要可查。适用于独立并行、大型任务与模块化开发。海底世界案例先统一规格、完成基座，再开发模块、接入玩法、集成修复和验收。本图是公开资料与讨论的理解总结，没有调用真实 Agent 或运行 3D 场景。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#235f50" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="2600" fill="#f5f3ee"/>
  <g font-family="Microsoft YaHei,system-ui,sans-serif" fill="#263732">
    <text x="56" y="57" font-size="16" fill="#9d4c31" letter-spacing="2">013 / CLAUDE MANAGED AGENTS / 2026.10.14</text>
    <text x="56" y="118" font-size="44" font-weight="700">多 Agent：把任务拆好、组织好</text>
    <text x="56" y="159" font-size="23" fill="#65716a">本质是多 Agent 的编排与运行管理 · 公开托管 API 能力研究</text>
    <rect x="56" y="192" width="1088" height="148" rx="9" fill="#235f50"/>
    <g fill="#fffefb"><text x="82" y="229" font-size="18">单次工作流</text><text x="78" y="304" font-size="76" font-weight="700">1,000</text><text x="405" y="241" font-size="27" font-weight="700">生命周期内累计启动 Agent 的上限</text><text x="405" y="278" font-size="21">不是 1,000 个同时工作，也不是质量或速度保证</text><text x="405" y="313" font-size="17">单流程当前并发 64（可变化） / 默认生命周期 24h / 会话默认开放流程 10</text></g>
    <text x="56" y="385" font-size="18" fill="#9d4c31" font-weight="700">01 / 核心分工：主 Agent 规划，程序组织，平台支撑</text>
    <g fill="#fffefb" stroke="#cbd4c8"><rect x="56" y="409" width="245" height="126" rx="7"/><rect x="336" y="409" width="245" height="126" rx="7"/><rect x="616" y="409" width="245" height="126" rx="7"/><rect x="896" y="409" width="248" height="126" rx="7"/></g>
    <g font-size="22" font-weight="700"><text x="78" y="445">目标与资料</text><text x="358" y="445">主 Agent 拆任务</text><text x="638" y="445">程序下发与交接</text><text x="918" y="445">验收与整体交付</text></g>
    <g font-size="18" fill="#65716a"><text x="78" y="479">需求、资料与规格</text><text x="78" y="508">完成条件与限制</text><text x="358" y="479">模型规划，定边界与依赖</text><text x="358" y="508">写任务与编排程序</text><text x="638" y="479">启动、等待、传递结果</text><text x="638" y="508">选择分支、重做与后续</text><text x="918" y="479">核对接口、运行与证据</text><text x="918" y="508">整体验收需明确设计</text></g>
    <g stroke="#235f50" stroke-width="2" marker-end="url(#arrow)"><path d="M305 465 H330"/><path d="M585 465 H610"/><path d="M865 465 H890"/></g>
    <rect x="56" y="555" width="1088" height="60" rx="7" fill="#235f50"/>
    <text x="80" y="593" font-size="22" fill="#fffefb">平台支撑运行：线程与状态 / 工具权限 / 预算 / 超时 / 事件与记录</text>
    <text x="56" y="655" font-size="18" fill="#9d4c31" font-weight="700">02 / 拆分怎样判断：模型应用工程方法，规划结果需要验证</text>
    <rect x="56" y="678" width="525" height="232" rx="8" fill="#e7eee6"/><rect x="603" y="678" width="541" height="232" rx="8" fill="#eee7de"/>
    <text x="82" y="719" font-size="24" font-weight="700">核心：把任务拆好</text><text x="629" y="719" font-size="24" font-weight="700">模型规划 + 开发者提供方法</text>
    <g font-size="20" fill="#425a4f"><text x="82" y="759">功能边界：每项任务负责什么</text><text x="82" y="793">数据依赖：需要谁提供哪些成果</text><text x="82" y="827">修改冲突：共享接口和文件谁维护</text><text x="82" y="861">验收条件：怎样证明局部与整体可用</text></g>
    <g font-size="20" fill="#665746"><text x="629" y="759">主 Agent 使用目标、资料与指令做判断</text><text x="629" y="793">框架提供运行机制与控制边界</text><text x="629" y="827">未披露保证最优拆分的通用算法</text><text x="629" y="861">计划可修订，质量靠实际成果验证</text></g>
    <text x="56" y="951" font-size="18" fill="#9d4c31" font-weight="700">03 / 每项任务的接口契约：能力与输入输出之外，还要有规则</text>
    <g fill="#fffefb" stroke="#cbd4c8"><rect x="56" y="973" width="350" height="93" rx="7"/><rect x="425" y="973" width="350" height="93" rx="7"/><rect x="794" y="973" width="350" height="93" rx="7"/><rect x="56" y="1081" width="350" height="93" rx="7"/><rect x="425" y="1081" width="350" height="93" rx="7"/><rect x="794" y="1081" width="350" height="93" rx="7"/></g>
    <g font-size="21" font-weight="700"><text x="80" y="1007">1 / 能力与职责</text><text x="449" y="1007">2 / 输入</text><text x="818" y="1007">3 / 输出</text><text x="80" y="1115">4 / 依赖与约束</text><text x="449" y="1115">5 / 完成标准</text><text x="818" y="1115">6 / 失败规则</text></g>
    <g font-size="18" fill="#65716a"><text x="80" y="1038">负责什么，边界是什么</text><text x="449" y="1038">目标、资料、代码与接口</text><text x="818" y="1038">成果、改动与检查记录</text><text x="80" y="1146">依赖、写入与工具范围</text><text x="449" y="1146">接口、场景、证据与整体行为</text><text x="818" y="1146">阻塞、修复、重试或披露缺失</text></g>
    <text x="56" y="1220" font-size="18" fill="#9d4c31" font-weight="700">04 / 内部可以黑盒，外部必须能验收与定位失败</text>
    <rect x="56" y="1243" width="525" height="166" rx="8" fill="#fffefb" stroke="#cbd4c8"/><rect x="603" y="1243" width="541" height="166" rx="8" fill="#e7eee6"/>
    <text x="82" y="1282" font-size="24" font-weight="700">内部可作为黑盒</text><text x="629" y="1282" font-size="24" font-weight="700">外部需要可查</text>
    <g font-size="20" fill="#65716a"><text x="82" y="1320">不必逐步干涉模型如何生成代码</text><text x="82" y="1354">实现可变化，需满足约定接口</text><text x="629" y="1320">状态、错误、操作与改动记录</text><text x="629" y="1354">验收证据、用量与未完成事项</text></g>
    <text x="56" y="1443" font-size="20">Agent 是执行单元，任务是委派，模块是成果对象。</text>
    <text x="56" y="1474" font-size="18" fill="#65716a">一个模块可经历开发、检查、修复与集成，Agent、任务和模块数量不必相同。</text>
    <text x="56" y="1516" font-size="18" fill="#9d4c31" font-weight="700">05 / 适用场景：独立并行、有依赖的大任务、模块化开发</text>
    <g fill="#fffefb" stroke="#cbd4c8"><rect x="56" y="1540" width="350" height="133" rx="7"/><rect x="425" y="1540" width="350" height="133" rx="7"/><rect x="794" y="1540" width="350" height="133" rx="7"/></g>
    <g font-size="22" font-weight="700"><text x="80" y="1577">独立并行任务</text><text x="449" y="1577">有依赖的大型任务</text><text x="818" y="1577">模块化开发</text></g>
    <g font-size="18" fill="#65716a"><text x="80" y="1610">按项目、文档或站点分别处理</text><text x="80" y="1638">统一比较与汇总</text><text x="449" y="1610">共享目标，分阶段开发与重规划</text><text x="449" y="1638">按依赖启动，持续验收</text><text x="818" y="1610">通过接口协作，分别提交成果</text><text x="818" y="1638">组合后仍需集成检查</text></g>
    <text x="56" y="1716" font-size="18" fill="#9d4c31" font-weight="700">06 / 海底世界：先完成可体验的小区域，再逐步扩大</text>
    <rect x="56" y="1741" width="1088" height="52" rx="6" fill="#e7eee6"/>
    <text x="80" y="1775" font-size="22" font-weight="700">第一版目标：小型珊瑚礁 + 游动与观察 + 三个探索地标</text>
    <path d="M600 1797 V1805" stroke="#235f50" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="56" y="1810" width="1088" height="52" rx="6" fill="#fffefb" stroke="#cbd4c8"/>
    <text x="80" y="1844" font-size="21">统一坐标、资源和接口约定 → 完成共享的场景基座</text>
    <path d="M600 1866 V1874" stroke="#235f50" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#fffefb" stroke="#cbd4c8"><rect x="56" y="1879" width="350" height="55" rx="6"/><rect x="425" y="1879" width="350" height="55" rx="6"/><rect x="794" y="1879" width="350" height="55" rx="6"/></g>
    <g font-size="21" font-weight="700"><text x="80" y="1914">环境：海床与珊瑚</text><text x="449" y="1914">玩家：移动与视角</text><text x="818" y="1914">鱼群：游动与避障</text></g>
    <path d="M231 1938 V1950 H969 V1938 M600 1950 V1959" fill="none" stroke="#235f50" stroke-width="2"/>
    <path d="M600 1953 V1959" stroke="#235f50" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="56" y="1964" width="1088" height="55" rx="6" fill="#235f50"/>
    <text x="80" y="1999" font-size="22" fill="#fffefb">互动与探索任务 → 集成检查 → 定向修复 → 整体验收</text>
    <text x="56" y="2051" font-size="18" fill="#65716a">可用临时数据提前开发，最终接入真实模块检查；例如鱼群穿珊瑚，定位原因后修复。</text>
    <text x="56" y="2079" font-size="18" fill="#65716a">先完成小区域，再增加海域、生物和玩法。本图为工作设计，未运行 3D 场景。</text>
    <text x="56" y="2125" font-size="18" fill="#9d4c31" font-weight="700">07 / 下发与控制：任务指令、编排程序、执行环境、成果验收</text>
    <rect x="56" y="2149" width="525" height="206" rx="8" fill="#e7eee6"/><rect x="603" y="2149" width="541" height="206" rx="8" fill="#eee7de"/>
    <text x="82" y="2188" font-size="23" font-weight="700">下发：明确任务与上下文</text><text x="629" y="2188" font-size="23" font-weight="700">控制：分别落实不同层次</text>
    <g font-size="18" fill="#425a4f"><text x="82" y="2222">普通子 Agent：主 Agent 委派并跟进</text><text x="82" y="2252">动态工作流：程序安排线程与后续</text><text x="82" y="2282">角色 + 目标 + 输入 + 交付 + 完成标准</text><text x="82" y="2312">工作流线程不能直接追加跟进消息</text></g>
    <g font-size="18" fill="#665746"><text x="629" y="2222">指令表达要求；程序管理依赖与返工</text><text x="629" y="2252">工具和环境落实操作与写入限制</text><text x="629" y="2282">提示词不能直接当作强制隔离</text><text x="629" y="2312">上下文独立，文件系统仍可能共享</text></g>
    <text x="56" y="2396" font-size="18" fill="#9d4c31" font-weight="700">08 / 参考价值：学习组织工作的架构与方法，再验证实际收益</text>
    <rect x="56" y="2418" width="1088" height="116" rx="8" fill="#e7eee6"/>
    <text x="80" y="2450" font-size="22" font-weight="700">具有参考价值：任务组织、运行管理与成果验收</text>
    <text x="80" y="2483" font-size="18" fill="#425a4f">先用少量任务形成基线，再扩展动态规划、恢复、模型选择与规模；质量、耗时和费用都需实测。</text>
    <text x="80" y="2514" font-size="18" fill="#425a4f">新闻与 API 文档不是完整调度源码；规划、接口、协作与验收仍需自己的实现和验证。</text>
    <line x1="56" y1="2556" x2="1144" y2="2556" stroke="#dcded4"/>
    <text x="56" y="2581" font-size="16" fill="#65716a">本仓库原创解释图 / 官方事实与设计示例分别记录 / 2026-10-14 / 详见网页 S0–S11</text>
  </g>
</svg>
