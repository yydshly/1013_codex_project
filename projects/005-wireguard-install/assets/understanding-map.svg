<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
  <title id="title">WireGuard Install 理解总览：部署脚本、加密 IP 隧道与服务器转发</title>
  <desc id="desc">安装器在 Linux 上生成密钥、配置转发和 NAT，并输出客户端配置。客户端与服务器作为 WireGuard peer 认证并协商密钥，把内部 IP 包加密封装在外部 UDP 中。服务器验证解封装，由 Linux 转发到目标服务；返回方向执行相反过程。WireGuard 加密止于 VPN 服务器，HTTPS 的 TLS 仍连接客户端应用与目标网站。默认提供集中出口，内网访问和分流需要额外配置；价值是部署自动化、出口控制和网络学习，也需要承担服务器和维护成本。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#25694e"/></marker>
    <marker id="goldArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#aa7734"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#203b34}
      .title{font-size:35px;font-weight:700}.subtitle{font-size:20px;fill:#5d7067}.label{font-size:17px;fill:#5d7067}
      .head{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:18px;fill:#526b5e}.mini{font-size:16px;fill:#5d7067}
      .green{fill:#25694e}.gold{fill:#936527}.white{fill:#fff}.bold{font-weight:700}
      .box{fill:#fff;stroke:#cdddcf;stroke-width:2}.rule{stroke:#dae4d8;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1440" height="1240" rx="22" fill="#f5f7f2"/>
  <text x="40" y="57" class="label">005 / hwdsl2/wireguard-install · 固定研究版本 3f42877</text>
  <text x="40" y="107" class="title">部署脚本 → IP 加密隧道 → 网关转发</text>
  <text x="40" y="143" class="subtitle">本质：给整个原始 IP 包增加加密封装，两端验证与解封装，系统负责继续转发。</text>

  <rect x="40" y="175" width="1360" height="122" rx="14" fill="#f3ead9" stroke="#ddc8a5" stroke-width="2"/>
  <text x="64" y="210" class="head gold">① 安装与管理阶段 · 本仓库的 Bash 脚本</text>
  <text x="64" y="250" class="body">检查 Linux / root → 安装工具 → 生成密钥与配置 → 设置转发、NAT、防火墙 → 启动 wg0</text>
  <text x="64" y="278" class="small">输出客户端 .conf / 二维码；后续添加与撤销 peer。每次操作结束，脚本退出。</text>
  <path d="M205 297V347" fill="none" stroke="#aa7734" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#goldArrow)"/>
  <text x="229" y="332" class="mini gold">交付接入配置</text>
  <path d="M846 297V347" fill="none" stroke="#aa7734" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#goldArrow)"/>
  <text x="870" y="332" class="mini gold">安装与更新服务端</text>

  <rect x="40" y="365" width="330" height="346" rx="14" class="box"/>
  <rect x="40" y="365" width="330" height="72" rx="14" fill="#e4efe4"/>
  <text x="62" y="412" class="head">② 客户端 · 手机 / 电脑</text>
  <text x="62" y="470" class="body bold">现成的 WireGuard 应用</text>
  <text x="62" y="504" class="small">内部地址：10.7.0.2（示例）</text>
  <path d="M62 526H347" class="rule"/>
  <text x="62" y="560" class="body">自己的私钥 + 服务器公钥</text>
  <text x="62" y="591" class="small">PSK / Endpoint / AllowedIPs</text>
  <text x="62" y="634" class="body">路由选包 → 加密与封装</text>
  <text x="62" y="667" class="body">验证与解密 → 交还应用</text>
  <text x="62" y="695" class="mini">Windows / macOS / 手机 / Linux</text>

  <rect x="650" y="365" width="400" height="346" rx="14" fill="#e8f0e5" stroke="#bcd2b6" stroke-width="2"/>
  <rect x="650" y="365" width="400" height="72" rx="14" fill="#25694e"/>
  <text x="675" y="412" class="head white">③ 服务端 · Linux 集中网关</text>
  <text x="675" y="470" class="body bold">WireGuard + 操作系统网络栈</text>
  <text x="675" y="504" class="small">wg0：10.7.0.1 / 默认 UDP 51820</text>
  <path d="M675 526H1025" class="rule"/>
  <text x="675" y="560" class="body">自己的私钥 + 各客户端公钥</text>
  <text x="675" y="591" class="small">每个 peer 绑定内部 IP，并共享 PSK</text>
  <text x="675" y="634" class="body">认证 / 防重放 / 解密 / 源 IP 检查</text>
  <text x="675" y="667" class="body">Linux 路由转发 / NAT / 防火墙</text>
  <text x="675" y="695" class="mini">返回时按内部目的 IP 选 peer，再加密</text>

  <rect x="1200" y="365" width="200" height="346" rx="14" class="box"/>
  <text x="1224" y="412" class="head">④ 目标服务</text>
  <path d="M1224 437H1376" class="rule"/>
  <text x="1224" y="480" class="body">网站 / SSH</text>
  <text x="1224" y="514" class="body">内网应用等</text>
  <text x="1224" y="568" class="small">处理业务协议</text>
  <text x="1224" y="603" class="small">接收与响应</text>
  <text x="1224" y="653" class="mini">通常无需安装</text>
  <text x="1224" y="678" class="mini">WireGuard</text>

  <text x="510" y="459" text-anchor="middle" class="body bold green">认证握手 · 会话密钥</text>
  <path d="M390 488H630" fill="none" stroke="#25694e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="525" text-anchor="middle" class="body bold">外部 IP / UDP / WG</text>
  <rect x="394" y="546" width="232" height="65" rx="9" fill="#d9e9d4" stroke="#97b68c"/>
  <text x="510" y="573" text-anchor="middle" class="small green">加密的整个内部 IP 包</text>
  <text x="510" y="598" text-anchor="middle" class="mini">内部目标仍是目标服务</text>
  <path d="M630 641H390" fill="none" stroke="#25694e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="679" text-anchor="middle" class="small">双向加密隧道</text>
  <text x="1125" y="477" text-anchor="middle" class="small">转发 / 出口 NAT</text>
  <path d="M1069 505H1180" fill="none" stroke="#25694e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1125" y="548" text-anchor="middle" class="mini">原业务协议继续</text>
  <path d="M1180 620H1069" fill="none" stroke="#25694e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1125" y="655" text-anchor="middle" class="mini">响应 / 反向 NAT</text>

  <path d="M72 731V750H1368V731" fill="none" stroke="#657f9c" stroke-width="2.5"/>
  <text x="720" y="787" text-anchor="middle" class="body bold" style="fill:#536d8a">HTTPS 示例：TLS 连接的是客户端应用与目标网站；VPN 网关通常不终止内部 TCP / TLS。</text>

  <rect x="40" y="819" width="407" height="170" rx="12" class="box"/>
  <text x="62" y="854" class="body bold">进入隧道前</text>
  <text x="62" y="896" class="body">内部 IP / TCP / TLS 业务数据</text>
  <text x="62" y="931" class="small">内层目的 IP = 目标网站</text>
  <text x="62" y="963" class="mini">内部也可为 UDP 等 IP 流量</text>
  <rect x="468" y="819" width="504" height="170" rx="12" fill="#dfeadb" stroke="#b3cbaa" stroke-width="2"/>
  <text x="490" y="854" class="body bold">隧道中 · 在外部协议里封装</text>
  <text x="490" y="896" class="body">外部 IP / UDP / WG [ 加密的内部包 ]</text>
  <text x="490" y="931" class="small">外层目的 IP = VPN 服务器</text>
  <text x="490" y="963" class="mini">WG = WireGuard；握手和数据都通过 UDP</text>
  <rect x="993" y="819" width="407" height="170" rx="12" class="box"/>
  <text x="1015" y="854" class="body bold">服务器解封装后</text>
  <text x="1015" y="896" class="body">内部 IP / TCP / TLS 业务数据</text>
  <text x="1015" y="931" class="small">TLS 仍加密；Linux 可修改 NAT 字段</text>
  <text x="1015" y="963" class="mini">网关解析隧道与网络字段，业务由应用处理</text>

  <rect x="40" y="1015" width="1360" height="145" rx="14" fill="#eaf0e4" stroke="#cbd9c4"/>
  <path d="M484 1039V1135M938 1039V1135" class="rule"/>
  <text x="64" y="1057" class="body bold">能力与场景</text>
  <text x="64" y="1091" class="small">自建集中出口 / 多设备密钥接入</text>
  <text x="64" y="1121" class="small">分流与访问内网需要补充路由及策略</text>
  <text x="510" y="1057" class="body bold">个人价值</text>
  <text x="510" y="1091" class="small">减少手配 / 控制出口 / 独立设备授权</text>
  <text x="510" y="1121" class="small">学习协议、系统网络和部署工程</text>
  <text x="964" y="1057" class="body bold">条件与边界</text>
  <text x="964" y="1091" class="small">服务器成本 / UDP 可达 / 持续维护</text>
  <text x="964" y="1121" class="small">速度与匿名性不保证；无自动 TCP 回退</text>
  <text x="40" y="1195" class="mini">原创教学示意 · 基于固定版本源码与 WireGuard 官方协议 · 2026-10-13 · 未部署 VPN、未抓包或做性能实测</text>
</svg>
