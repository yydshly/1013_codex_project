<text x="95" y="2984" font-size="27" fill="#dcf294" font-weight="500" text-anchor="start">学会识别项目解决哪一层；把“概念 → 调用链 → 源码 → 最小实测 → 局限”变成研究方法。</text>
<text x="95" y="3027" font-size="23" fill="#f8f7f2" font-weight="400" text-anchor="start">适合补系统基础、做中文知识整理和研究工具；对日常 AI / 资料自动化的直接收益较少，深入程度按你的目标选择。</text>
