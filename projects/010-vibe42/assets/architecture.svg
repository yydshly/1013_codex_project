<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1080" role="img" aria-labelledby="title desc">
  <title id="title">Vibe42 三端逻辑架构与信任边界</title>
  <desc id="desc">控制端、平台与目标电脑分工。账号和设备服务协调授权，工作内容在控制端与电脑间加密传输，直连或通过中继。Companion接入终端与会话，原生Agent执行任务。通知经过系统推送。内部组件边界与通知管道属于公开资料推导，未运行验证。</desc>
  <defs>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#346b52"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7e9288"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a08754"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#25453b} .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#748374}.column{font-size:19px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:17px}.note{font-size:14px;fill:#738272}.tiny{font-size:13px;fill:#738272}.green{stroke:#346b52;stroke-width:3;fill:none;marker-end:url(#green)}.duplex{stroke:#346b52;stroke-width:3;fill:none;marker-start:url(#green);marker-end:url(#green)}.control{stroke:#7e9288;stroke-width:2;stroke-dasharray:6 6;fill:none;marker-start:url(#gray);marker-end:url(#gray)}.push{stroke:#a08754;stroke-width:2.5;fill:none;marker-end:url(#gold)}.box{fill:#fffef9;stroke:#cbd7c8;stroke-width:1.5}.host{fill:#e8eee2;stroke:#cbd7c8;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1320" height="1080" fill="#f8f8f1"/>
  <text x="40" y="57" class="title">执行在电脑，操作跨设备</text>
  <text x="40" y="87" class="sub">Vibe42 · 公开资料形成的逻辑架构 / 原创解释图 · 2026-10-14</text>
  <path d="M43 118H91" class="green"/><text x="107" y="123" class="tiny">工作内容：设备间加密</text>
  <path d="M342 118H390" class="control"/><text x="407" y="123" class="tiny">身份 / 授权 / 在线与路由</text>
  <path d="M676 118H724" class="push"/><text x="741" y="123" class="tiny">状态事件 / 系统通知（完整管道为推导）</text>

  <rect x="815" y="148" width="465" height="817" rx="16" class="host"/>
  <text x="40" y="174" class="column">01 控制端</text>
  <text x="365" y="174" class="column">02 平台基础设施</text>
  <text x="838" y="174" class="column">03 目标电脑 · Mac / Linux</text>

  <rect x="40" y="196" width="285" height="140" rx="10" class="box"/>
  <text x="60" y="232" class="label">手机 / 平板 / 浏览器</text>
  <text x="60" y="267" class="body">人选择电脑与会话</text>
  <text x="60" y="294" class="body">输入、查看、处理确认</text>
  <text x="60" y="318" class="note">Windows 可作为浏览器控制端</text>

  <rect x="365" y="196" width="410" height="140" rx="10" class="box"/>
  <text x="389" y="232" class="label">账号与设备控制面</text>
  <text x="389" y="267" class="body">登录 / 配对 / 授权 / presence</text>
  <text x="389" y="294" class="body">保存必要账号与连接元数据</text>
  <text x="389" y="318" class="note">职责有公开依据；内部服务划分未公开</text>

  <rect x="838" y="196" width="419" height="140" rx="10" class="box"/>
  <text x="860" y="232" class="label">Companion 电脑接入服务</text>
  <text x="860" y="267" class="body">保持在线，接入本机工作资源</text>
  <text x="860" y="294" class="body">Linux：用户级 systemd / supervisor</text>
  <text x="860" y="318" class="note">Mac 应用内含服务；电脑需持续运行</text>
  <path d="M327 256H362" class="control"/>
  <path d="M777 256H835" class="control"/>

  <path d="M325 448C350 353 803 353 838 448" class="duplex"/>
  <rect x="492" y="346" width="177" height="32" rx="15" fill="#f8f8f1"/>
  <text x="518" y="368" font-size="16" fill="#346b52">可行时：直接通信</text>

  <rect x="40" y="416" width="285" height="177" rx="10" class="box"/>
  <text x="60" y="454" class="label">交互与渲染</text>
  <text x="60" y="489" class="body">文字 / 按键 / 尺寸 / 触摸</text>
  <text x="60" y="518" class="body">终端文字、光标、颜色、图片</text>
  <text x="60" y="547" class="body">文件或远程桌面画面</text>
  <text x="60" y="574" class="note">Ghostty / Kitty 来自产品说明</text>

  <rect x="365" y="416" width="410" height="177" rx="10" fill="#edf0e4" stroke="#adbea8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="389" y="454" class="label">必要时：密文中继</text>
  <text x="389" y="489" class="body">转发加密工作数据</text>
  <text x="389" y="518" class="body">官方称中继不持有内容解密密钥</text>
  <text x="389" y="548" class="body">Noise 握手 / 端点持钥：官方声明</text>
  <text x="389" y="574" class="note">具体模式、打洞与浏览器回退未公开</text>
  <path d="M328 510H362" class="duplex"/>
  <path d="M778 510H835" class="duplex"/>

  <rect x="838" y="416" width="419" height="177" rx="10" class="box"/>
  <text x="860" y="454" class="label">终端 / 持续会话 / 资源桥接</text>
  <text x="860" y="489" class="body">PTY 承载交互式程序输入与输出</text>
  <text x="860" y="518" class="body">Linux 文档要求 tmux ≥ 3.0</text>
  <text x="860" y="547" class="body">文件桥接 / Mac 桌面权限与输入</text>
  <text x="860" y="574" class="note">Mac 会话、画面编码、缓冲细节未知</text>
  <path d="M1048 338V408" class="green"/>
  <path d="M1048 595V649" class="duplex"/>
  <text x="1070" y="629" class="tiny">本机输入输出</text>

  <rect x="838" y="658" width="419" height="168" rx="10" class="box"/>
  <text x="860" y="696" class="label">原生 Agent / shell / 开发工具</text>
  <text x="860" y="731" class="body">解释任务、调用工具、执行测试</text>
  <text x="860" y="760" class="body">代码修改与实际产物留在电脑</text>
  <text x="860" y="792" class="note">原生任务 / 审批接口取决于 Agent 集成</text>
  <text x="860" y="813" class="tiny">运行权限来自主机用户与具体程序</text>

  <rect x="365" y="658" width="410" height="168" rx="10" class="box"/>
  <text x="389" y="696" class="label">状态处理与通知交付</text>
  <text x="389" y="731" class="body">OSC 7501 等状态输入 → 推送事件</text>
  <text x="389" y="760" class="body">idle / working / done / blocked / error</text>
  <text x="389" y="792" class="note">协议、APNs/FCM 有依据；整条管道为推导</text>
  <text x="389" y="813" class="tiny">done 仍需核对结果与产物</text>
  <path d="M835 746H779" class="push"/>

  <rect x="40" y="658" width="285" height="168" rx="10" class="box"/>
  <text x="60" y="696" class="label">手机系统推送</text>
  <text x="60" y="731" class="body">APNs / FCM</text>
  <text x="60" y="760" class="body">App 关闭后可收到通知</text>
  <text x="60" y="792" class="note">回到控制端，读取工作结果</text>
  <text x="60" y="813" class="tiny">推送令牌属于必要运营数据</text>
  <path d="M363 746H329" class="push"/>
  <path d="M182 656V597" class="push"/>

  <rect x="838" y="861" width="419" height="82" rx="10" fill="#dbe5d3"/>
  <text x="860" y="893" font-size="18" font-weight="700">Agent 自身的模型 / 工具调用</text>
  <text x="860" y="923" class="note">另由 Agent 配置；不由远控 E2EE 自动覆盖</text>
  <path d="M1048 829V855" class="green"/>
  <text x="40" y="877" class="body">会话持续的前提</text>
  <text x="40" y="907" class="note">手机离开 ≠ 电脑休眠 ≠ Companion 退出 ≠ Agent 结束。</text>
  <text x="40" y="935" class="note">活进程、终端显示状态与原生 Agent 历史需要分别恢复和验证。</text>

  <path d="M40 988H1280" stroke="#ccd6c6"/>
  <text x="40" y="1017" class="note">来源：Vibe42 官网、install.md、安装入口与隐私说明；PTY / tmux / Noise / OSC7501 标准与官方文档。</text>
  <text x="40" y="1045" class="note">证据边界：这是职责解释图，未取得核心源码，未安装配对、抓包或性能测试；不是上游截图或真实连接状态。</text>
</svg>
