<text x="70" y="1222" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#607465">此图按职责解释机制，不是逐函数调用图；原生透传、优化与错误路径可能绕过部分转换。</text>
