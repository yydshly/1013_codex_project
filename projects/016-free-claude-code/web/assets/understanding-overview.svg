<text x="610" y="506" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#eff5e4">统一入口，适配与路由</text>
<text x="610" y="550" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#d0dfc7">模型配置 · 协议与事件转换</text>
<text x="610" y="585" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#d0dfc7">真实调用 · 重试与有序备用</text>
