<text x="1125" y="460" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">03 / 真实模型服务</text>
<text x="1125" y="506" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">理解、生成与调用决策</text>
<text x="1125" y="550" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">供应商云端 / 本地推理服务</text>
<text x="1125" y="585" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">能力、上下文与输出行为各异</text>
