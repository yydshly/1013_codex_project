<text x="825" y="359" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="550" fill="#173d38">降低接口依赖</text>
<text x="1178" y="330" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#607465">边界</text>
<text x="1178" y="359" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="550" fill="#173d38">质量仍需验收</text>
<rect x="70" y="425" width="430" height="235" rx="12" fill="#edf0e4" stroke="#cbd5c5"/>
<text x="95" y="460" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">01 / AGENT 执行框架</text>
<text x="95" y="506" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">组织任务，执行工具</text>
<text x="95" y="550" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">上下文 · 工具定义 · 执行权限</text>
<text x="95" y="585" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">读写文件 · 命令 · 结果验收</text>
