<text x="310" y="1107" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#173d38">返回方向：真实模型输出 → 转为客户端格式 → Agent 继续工作</text>
<rect x="70" y="1200" width="1460" height="153" rx="12" fill="#173d38" stroke="#173d38"/>
<text x="100" y="1241" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#eff5e4">工具闭环：模型给指令，Agent 负责实际操作</text>
<text x="100" y="1288" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#caddc3">模型提出工具调用 → FCC 转换事件 → Agent 按权限执行 → 结果再经网关交给模型</text>
<text x="100" y="1323" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#caddc3">例如 Claude Code → FCC → DeepSeek：保留工具框架，由 DeepSeek 提供生成能力。</text>
<text x="70" y="1430" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="32" font-weight="600" fill="#173d38">能力、场景、价值与意义：为什么值得研究？</text>
<rect x="70" y="1470" width="710" height="280" rx="12" fill="#fffef9" stroke="#cbd5c5"/>
<text x="95" y="1505" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">已有支持 / 效果需实测</text>
<text x="95" y="1551" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">能力</text>
<text x="95" y="1595" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">统一模型配置与目录 · 自定义服务</text>
<text x="95" y="1630" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">消息、工具、响应和流式事件适配</text>
<text x="95" y="1665" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">档位映射 · 重试与备用 · 辅助请求优化</text>
<text x="95" y="1700" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">浏览器、IDE、消息入口各有运行条件</text>
<rect x="820" y="1470" width="710" height="280" rx="12" fill="#fffef9" stroke="#cbd5c5"/>
<text x="845" y="1505" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">使用场景 / 接口需兼容</text>
<text x="845" y="1551" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">场景</text>
<text x="845" y="1595" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">保持 Agent 工作方式，经常切换模型</text>
<text x="845" y="1630" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">同任务模型比较 · 本地推理 · 故障备选</text>
<text x="845" y="1665" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">写作、SEO、RAG 的生成环节接入</text>
<text x="845" y="1700" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">浏览器或手机入口需执行环境持续运行</text>
<rect x="70" y="1790" width="710" height="280" rx="12" fill="#fffef9" stroke="#cbd5c5"/>
<text x="95" y="1825" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">对我们的价值 / 用真实任务验收</text>
<text x="95" y="1871" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">价值与意义</text>
<text x="95" y="1915" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">降低重复接入、迁移和配置的工作</text>
<text x="95" y="1950" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">Agent 工作方式与模型服务分别选择</text>
<text x="95" y="1985" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">理解执行、接口与模型的职责分工</text>
<text x="95" y="2020" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">积累完成率、返工、耗时和真实费用</text>
<rect x="820" y="1790" width="710" height="280" rx="12" fill="#fffef9" stroke="#cbd5c5"/>
<text x="845" y="1825" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">已有自定义接口 / 其他方向需建设</text>
<text x="845" y="1871" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="28" font-weight="600" fill="#173d38">可扩展方向</text>
<text x="845" y="1915" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">先配置自己的 API 或本地模型服务</text>
<text x="845" y="1950" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">任务语义路由 · 能力与预算约束</text>
<text x="845" y="1985" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">知识库工具 · 用量和评测记录</text>
<text x="845" y="2020" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="22" font-weight="400" fill="#607465">团队权限 · 兼容回归 · 产物验收</text>
<rect x="70" y="2110" width="1460" height="138" rx="12" fill="#e5ecd9" stroke="#d5ddd5"/>
<text x="97" y="2148" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" font-weight="600" fill="#173d38">与以前项目的关系</text>
<text x="97" y="2186" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#607465">FCC / FreeLLMAPI：模型网关；Jev：任务判断与选择策略。</text>
<text x="97" y="2221" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#607465">Agenvo：原生 Agent 接入；cmux / Vibe42：会话工作台与远程操作。</text>
<text x="70" y="2305" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#607465">适配不会训练模型；免费来自供应商额度或本地方案；单模型直连已够用时，新增层收益可能有限。</text>
<text x="70" y="2339" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="400" fill="#607465">真实调用、工具质量、恢复效果和任务总成本待实测。图为原创研究解释，非运行截图。</text>
<text x="70" y="2410" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#607465">固定源码 74d4ccf · AGPL-3.0-only · 2026-10-14 · 来源：Alishahryar1/free-claude-code 与既有固定版本研究</text>
