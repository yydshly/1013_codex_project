<text x="1030" y="620" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="16" font-weight="400" fill="#607465">输出</text>
<text x="70" y="706" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="25" font-weight="550" fill="#173d38">解耦的是客户端与具体服务的接口依赖；模型能力差异仍然存在。</text>
