<title id="title">Free Claude Code：适配解耦完整理解总览</title><desc id="desc">在 Agent 和真实模型之间增加模型网关，用统一接口、协议适配和配置路由降低接入耦合。包含三方职责、底层模块、工具闭环、能力、场景、价值、意义、扩展、同类定位与验证边界。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="2460" fill="#f7f6f0"/>
<text x="70" y="68" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="19" font-weight="400" fill="#607465">016 / FREE CLAUDE CODE / 我们的完整理解</text>
<text x="70" y="146" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="56" font-weight="650" fill="#173d38">Agent 与真实模型之间，加一个网关。</text>
<text x="70" y="207" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="34" font-weight="550" fill="#bf5337">接口适配实现解耦，工作方式与模型服务分别选择。</text>
<text x="70" y="259" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" fill="#607465">统一代理地址是入口；消息、工具和响应适配是机制；模型可替换是核心价值。</text>
<rect x="70" y="300" width="1460" height="78" rx="12" fill="#e5ecd9" stroke="#d5ddd5"/>
<text x="95" y="330" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#607465">能力</text>
<text x="95" y="359" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="550" fill="#173d38">统一接入与调用</text>
<text x="462" y="330" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="400" fill="#607465">原理</text>
<text x="462" y="359" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="550" fill="#173d38">适配与转发</text>
