<title id="title">tchMaterial Parser 小学教材批量下载与整理理解总览</title>
<desc id="desc">官方平台提供资料，工具识别链接、请求元信息、认证并下载，用户本地命名分类保存。价值是批量获取和自动整理；适合整学期资料、听力、备课与教材版本比较。当前没有正文分析和 RAG。</desc>
